<!doctype html><meta charset="utf-8"><title>Fetta 1 functional real-act regression</title><pre id="out">RUNNING</pre>
<script type="module">
import { daAkn } from '../../public/js/model.js';
import { applicaModifica, tuttiNodi, trovaNodo } from '../../public/js/engine.js';
const out=document.querySelector('#out');
const report=[]; const check=(name,fn)=>{try{const v=fn();report.push({test:name,status:'PASS',detail:v??''});}catch(e){report.push({test:name,status:'FAIL',detail:e.message});}};
try {
 const xml=await (await fetch('../fixtures/akn/AS1308.akn')).text();
 const source=daAkn(xml,{nomeFile:'AS1308.akn'});
 const nodes=tuttiNodi(source.radice);
 const articles=nodes.filter(n=>n.tipo==='articolo');
 const article=articles[0];
 const comma=article?.figli.find(n=>n.tipo==='comma');
 check('Importazione AS1308 e individuazione art. 1, comma 1',()=>{if(!article||!comma)throw Error('articolo/comma non individuati');return `${article.id} / ${comma.id}`;});
 check('Fonte riconosciuta come bill/emendamento',()=>{if(source.radice.metadati.tipoDocumentoAkn!=='bill')throw Error('tipo documento AKN non è bill');return source.radice.metadati.tipoDocumentoAkn;});
 const original=comma?.testo||'';
 check('Sostituzione di una singola occorrenza su testo reale',()=>{const needle=original.split(/\s+/).find(w=>w.length>7);if(!needle)throw Error('nessuna parola adatta');const res=applicaModifica(source,{id:'real-1',operazione:'sostituzione_testo',nodoId:comma.id,testoAtteso:needle,testoNuovo:'TESTO_SOSTITUTIVO'},'emendamento');if(!res.atto.radice||!trovaNodo(res.atto.radice,comma.id)?.testo.includes('TESTO_SOSTITUTIVO'))throw Error('sostituzione non riflessa');if(trovaNodo(source.radice,comma.id).testo!==original)throw Error('fonte originale modificata');return `${needle} → TESTO_SOSTITUTIVO`;});
 check('Sostituzione integrale del comma su copia',()=>{const res=applicaModifica(source,{id:'real-2',operazione:'sostituzione_partizione',nodoId:comma.id,testoPartizione:'Testo integrale sostitutivo.'},'emendamento');if(trovaNodo(res.atto.radice,comma.id).testo!=='Testo integrale sostitutivo.')throw Error('sostituzione integrale non riuscita');return res.documento;});
 check('Abrogazione del comma su copia',()=>{const res=applicaModifica(source,{id:'real-3',operazione:'abrogazione',nodoId:comma.id},'emendamento');if(trovaNodo(res.atto.radice,comma.id))throw Error('comma ancora presente');if(!trovaNodo(source.radice,comma.id))throw Error('fonte originale alterata');return res.documento;});
 check('Inserimento di un comma aggiuntivo su copia',()=>{const res=applicaModifica(source,{id:'real-4',operazione:'inserimento_partizione',nodoId:comma.id,posizione:'dopo',tipoNuovo:'comma',etichettaNuova:'1-bis',testoPartizione:'Comma aggiunto di prova.'},'emendamento');const art2=trovaNodo(res.atto.radice,article.id);if(!art2.figli.some(n=>n.etichetta==='1-bis'))throw Error('comma 1-bis non inserito');return res.documento;});
 check('Nessuna collisione ID dopo inserimento',()=>{const res=applicaModifica(source,{id:'real-5',operazione:'inserimento_partizione',nodoId:comma.id,posizione:'dopo',tipoNuovo:'comma',etichettaNuova:'1-ter',testoPartizione:'Altro comma di prova.'},'emendamento');const ids=tuttiNodi(res.atto.radice).map(n=>n.idInterno);if(new Set(ids).size!==ids.length)throw Error('ID interni duplicati');return `${ids.length} ID univoci`;});
} catch(e){report.push({test:'Caricamento e test',status:'FAIL',detail:e.stack||e.message});}
out.textContent=JSON.stringify(report,null,2)+'\n'+report.filter(x=>x.status==='PASS').length+' PASS · '+report.filter(x=>x.status==='FAIL').length+' FAIL';
</script>
