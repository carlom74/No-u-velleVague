<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Test E2E No(u)velle vague 0.7</title><style>body{font:14px system-ui;max-width:1000px;margin:30px auto;padding:0 18px;color:#243746}h1{font:26px Georgia}#summary{padding:12px;background:#edf4f8;border-radius:8px}li{padding:5px} .pass{color:#287653}.fail{color:#a33e3e}pre{white-space:pre-wrap;background:#f5f7f8;padding:12px;border-radius:6px}</style><h1>Regressione browser — Novellazione completa 0.7</h1><p>Fixture: L. 241/1990, XML Normattiva vigente al 1° gennaio 2026. Tutti i test sono eseguiti nel browser mediante DOMParser.</p><div id="summary">Esecuzione…</div><ol id="results"></ol><pre id="details"></pre><script type="module">
import {daAkn,validaModello} from '../../public/js/model.js';import {VERSION,walk,addIntervention,makeScenario,setScenarioDecision,validateScenario,applyScenario,composeDocument,createProject,validateProject} from '../../public/js/novella-core.js';
const out=document.querySelector('#results'),details=document.querySelector('#details');let pass=0,fail=0;function check(name,fn){try{fn();pass++;const li=document.createElement('li');li.className='pass';li.textContent='PASS — '+name;out.append(li);}catch(e){fail++;const li=document.createElement('li');li.className='fail';li.textContent='FAIL — '+name+' — '+e.message;out.append(li);details.textContent+=name+'\n'+(e.stack||e)+'\n\n';}}
const xml=await fetch('../fixtures/atti/legge_1990-08-07_n241__vig2026-01-01__ver2026-01-01.xml').then(r=>{if(!r.ok)throw Error('Fixture non caricata');return r.text()});const base=daAkn(xml,{nomeFile:'L. 241/1990'});const diagnostics=validaModello(base);let ids=[],articles=0,commas=0;walk(base.radice,n=>{ids.push(n.id);if(n.tipo==='articolo')articles++;if(n.tipo==='comma')commas++;});check('Import XML Normattiva',()=>{if(!articles||!commas)throw Error('Partizioni non individuate');});check('Identificativi interni univoci',()=>{if(new Set(ids).size!==ids.length)throw Error('Collisione ID');});check('Struttura e diagnostica accessibili',()=>{if(!base.radice||!Array.isArray(base.diagnostica)||!Array.isArray(diagnostics))throw Error('Modello incompleto');});
const s={base,registry:[],relations:[],scenarios:[],activeScenarioId:null};const art=base.radice.figli.find(n=>n.tipo==='articolo'&&n.figli?.some(c=>c.tipo==='comma'&&c.testo?.trim()));if(!art)throw Error('Articolo con comma non trovato');const comma=art.figli.find(c=>c.tipo==='comma'&&c.testo?.trim());const needle=comma.testo.trim().split(/\s+/).slice(0,2).join(' ');const a=addIntervention(s,'sostituzione_testo',comma.id,{testoAtteso:needle,testoNuovo:'TESTO MODIFICATO'});check('Registrazione intervento su bersaglio reale',()=>{if(s.registry.length!==1)throw Error('Record non creato');});const b=addIntervention(s,'abrogazione',comma.id);check('Registro permissivo e conflitto',()=>{if(s.registry.length!==2||!s.relations.length)throw Error('Conflitto non registrato');});const sc1=makeScenario(s,'Sostituzione');setScenarioDecision(sc1,a.id,'incluso');setScenarioDecision(sc1,b.id,'escluso');check('Scenario valido',()=>{if(validateScenario(s,sc1).status!=='valido')throw Error('Scenario non valido');});check('Applicazione non distruttiva',()=>{const result=applyScenario(s,sc1);if(result.atto===base||comma.testo===result.atto.radice.figli[0]?.testo)throw Error('Base alterata');});check('Composizione e mapping',()=>{const doc=composeDocument(s,sc1);if(doc.blocks.length!==1||doc.blocks[0].interventionIds[0]!==a.id)throw Error('Mapping incompleto');});const sc2=makeScenario(s,'Conflitto');setScenarioDecision(sc2,a.id,'incluso');setScenarioDecision(sc2,b.id,'incluso');check('Scenario con conflitto bloccato',()=>{if(validateScenario(s,sc2).status!=='non_valido')throw Error('Conflitto non bloccato');});check('Round-trip progetto',()=>{const p=createProject({...s,activeScenarioId:sc1.id});if(!validateProject(JSON.parse(JSON.stringify(p))))throw Error('Round-trip fallito');});
